<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crownfall Marches</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="app">
<header><div><h1>Crownfall Marches</h1><small>Raise a crown from one border settlement.</small></div><div class="topstats"><span id="day"></span><span id="influence"></span><span id="realm"></span><span id="phase"></span></div><div class="time"><button data-speed="0">Ⅱ</button><button data-speed="0.25" title="Normal — reaction speed">▶</button><button data-speed="1" title="Fast">▶▶</button><button data-speed="4" title="Very fast">▶▶▶</button></div></header>
<div id="tutorial" class="tutorial hidden"></div>
<main><section id="mapWrap"><svg id="roads"></svg><div id="map"></div><div id="mapNotice" class="mapNotice hidden"></div><div id="legend"></div></section><aside>
<nav><button class="tab active" data-tab="settlement">Settlement</button><button class="tab" data-tab="realm">Realm</button><button class="tab" data-tab="diplomacy">Diplomacy</button><button class="tab" data-tab="chronicle">Chronicle</button></nav>
<div id="panel"></div>
</aside></main>
<footer><button id="newGame">New World</button><button id="save">Save</button><button id="load">Load</button><button id="help">How to Play</button><button id="threatPause" title="Automatically pause when an enemy army targets your realm">Threat Pause: ON</button><span id="status">Ready.</span></footer>
<div id="modal" class="modal hidden"><div class="modalCard"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div>
<script type="module" src="src/app.js"></script></body></html>
