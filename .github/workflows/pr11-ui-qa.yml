name: PR11 UI QA
on:
  push:
    branches:
      - feature/v1.4.8-first-hour
permissions:
  contents: read
jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium webkit
      - name: Start static server
        run: |
          python -m http.server 8000 >/tmp/crownfall-http.log 2>&1 &
          sleep 2
      - name: Run focused UI QA
        run: python qa/pr11_ui_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr11-ui-qa
          path: qa-output/
